name: Firebase QA & E2E Browser Testing

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  firebase-qa:
    name: Firestore Rules, Unit & Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Java (required for Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: TypeScript type check
        run: npm run lint

      - name: Start Firebase Emulator and run unit tests
        run: |
          firebase emulators:exec \
            --only firestore,auth \
            --project gen-lang-client-0159817859 \
            "npx vitest run --reporter=verbose"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Run Playwright End-to-End Browser Tests
        run: npm run test:e2e

      - name: Upload test results & Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
            playwright-report/
